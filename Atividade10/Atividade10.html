<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de criar objetos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #bb86fc;
            text-align: center;
        }

        #custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #custom-alert-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-alert-box {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            border: 1px solid #333;
        }

        #custom-alert-overlay.show .custom-alert-box {
            transform: translateY(0);
        }

        .custom-alert-message {
            font-size: 1.1rem;
            margin-bottom: 24px;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .custom-alert-btn {
            background: #bb86fc;
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .custom-alert-btn:hover {
            background: #9965f4;
        }
    </style>
</head>
<body>
    <h1>Atividade 10</h1>

    <div id="custom-alert-overlay">
        <div class="custom-alert-box">
            <div class="custom-alert-message" id="custom-alert-message"></div>
            <button class="custom-alert-btn" id="custom-alert-btn">OK</button>
        </div>
    </div>

    <script>
        function myAlert(msg) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('custom-alert-overlay');
                const messageEl = document.getElementById('custom-alert-message');
                const btn = document.getElementById('custom-alert-btn');

                messageEl.innerText = msg;
                overlay.classList.add('show');

                const onClick = () => {
                    overlay.classList.remove('show');
                    btn.removeEventListener('click', onClick);
                    resolve();
                };

                btn.addEventListener('click', onClick);
            });
        }

        (async function() {
            await myAlert(`Aluno 1`);
            var aluno1 = new Object();
            aluno1.nome = 'Eduardo';
            aluno1.ra = '1234567890';
            await myAlert(`O aluno ${aluno1.nome} tem o RA ${aluno1.ra}`);

            await myAlert(`Aluno 2`);
            var aluno2 = {};
            aluno2.ra = '1234567890';
            aluno2['nome'] = 'Enzo';
            await myAlert(`O aluno ${aluno2.nome} tem o RA ${aluno2.ra}`);
            aluno2["email do aluno"] = "enzo@gmail.com";
            await myAlert(aluno2["email do aluno"]);

            await myAlert(`Aluno 3`);
            var aluno3 = {
                nome: 'José',
                ra: '1234567890',
            };
            await myAlert(`O aluno ${aluno3.nome} tem o RA ${aluno3.ra}`);

            await myAlert(`Aluno 4`);
            function Aluno(nome, ra) {
                this.nome = nome;
                this.ra = ra;
                this.MostraDados = function() {
                    return `O aluno ${this.nome} tem o RA ${this.ra}`;
                }
            }
            var aluno4 = new Aluno('Lucas', '1234567890');
            await myAlert(aluno4.MostraDados());

            function Aluno2() {
                var ra;
                var nome;
                this.setRa = function(value) {
                    ra = value;
                }
                this.setNome = function(value) {
                    nome = value;
                }
                this.getRa = function() {
                    return ra;
                }
                this.getNome = function() {
                    return nome;
                }
            }

            await myAlert(`Aluno 5`);
            var aluno5 = new Aluno2();
            aluno5.setRa('1234567890');
            aluno5.setNome('Pedro');
            await myAlert(`O aluno ${aluno5.getNome()} tem o RA ${aluno5.getRa()}`);

            await myAlert(`Aluno 6`);
            var aluno6 = new Aluno2();
            aluno6.setRa('1234567890');
            aluno6.setNome('Pedro');
            await myAlert(`O aluno ${aluno6.getNome()} tem o RA ${aluno6.getRa()}`);

            await myAlert(`Aluno 7`);
            function AlunoADS(){
                var numLab;
                this.setNumLab = function(value) {
                    numLab = value;
                }
                this.getNumLab = function() {
                    return numLab;
                }
            }

            AlunoADS.prototype = new Aluno2();

            var aluno7 = new AlunoADS();
            aluno7.setRa('1234567890');
            aluno7.setNome('Murilo');
            aluno7.setNumLab('5');
            await myAlert(`O aluno ${aluno7.getNome()} tem o RA ${aluno7.getRa()} e o número do laboratório é ${aluno7.getNumLab()}`);

            await myAlert(`Aluno 8`);
            class Aluno1{
                constructor(){
                    this.nome = '';
                    this.ra = '';
                    this.numLab = '';
                }
                setNome(nome){
                    this.nome = nome;
                }
                setRa(ra){
                    this.ra = ra;
                }
                setNumLab(numLab){
                    this.numLab = numLab;
                }
                getNome(){
                    return this.nome;
                }
                getRa(){
                    return this.ra;
                }
            }
            var objAluno = new Aluno1();
            objAluno.setNome('Daniel');
            objAluno.setRa('1234567890');
            objAluno.setNumLab('5');
            await myAlert(`O aluno ${objAluno.getNome()} tem o RA ${objAluno.getRa()}`);

            await myAlert(`Aluno 9`);
            class AlunoADS1 extends Aluno1{
                constructor(){
                    super();
                    this.numLab = '';
                }
                setNumLab(numLab){
                    this.numLab = numLab;
                }
                getNumLab(){
                    return this.numLab;
                }
            }
            var objAlunoADS = new AlunoADS1();
            objAlunoADS.setNome('Richard');
            objAlunoADS.setRa('0031432612024');
            objAlunoADS.setNumLab('6');
            await myAlert(`O aluno ${objAlunoADS.getNome()} tem o RA ${objAlunoADS.getRa()} e o número do laboratório é ${objAlunoADS.getNumLab()}`);

            await myAlert(`Cópia de objeto`);
            var obj1 = new Object();
            var obj2 = obj1;
            obj1.nome = 'Camila';
            await myAlert(obj2.nome);

            class ContaBancaria{
                #cpf
                constructor(nome, saldoInicial){
                    this.nome = nome;
                    this.saldo = saldoInicial;
                }

                setCpf(value){
                    this.#cpf = value;
                }
                getCpf(){
                    return this.#cpf;
                }

                getSaldo(){
                    return this.saldo;
                }

                depositar(valor){
                    this.saldo += valor;
                    this.#registrarTransacao(valor);
                }

                #registrarTransacao(valor){
                    console.log(`Depósito de R$ ${valor}, realizado pelo ${this.nome} e o Saldo R$ ${this.saldo} para cpf ${this.getCpf()} ou ${this.#cpf}`);
                }   
            }

            const conta = new ContaBancaria("Gustavo", 1000);
            conta.setCpf(123);
            conta.depositar(500);

        })();
    </script>
</body>
</html>
