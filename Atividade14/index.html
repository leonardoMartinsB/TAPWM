<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercício 1</title>
    <script>
        function validar() {
            var nome = document.nomeform.elements[0].value;
            var comentario = document.nomeform.elements[2].value;
            var radioSim = document.nomeform.elements[3];
            var radioNao = document.nomeform.elements[4];

            if (nome.length < 10) {
                alert("O nome deve ter no mínimo 10 caracteres.");
                return false;
            }

            if (comentario.length < 20) {
                alert("O comentário deve ter no mínimo 20 caracteres.");
                return false;
            }

            if (!radioSim.checked && !radioNao.checked) {
                alert("Por favor, responda a pesquisa.");
                return false;
            }

            if (radioNao.checked) {
                alert("Que bom que você voltou a visitar esta página!");
            } else {
                alert("Volte sempre à está página!");
            }

            return true;
        }
    </script>
</head>

<body>

    <h2>Formulário Principal</h2>

    <form name="nomeform" onsubmit="return validar()">
        <label>Nome:</label><br>
        <input type="text" name="nome"><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email"><br><br>

        <label>Comentário:</label><br>
        <textarea name="comentario"></textarea><br><br>

        <label>Pesquisa:</label><br>
        <label>Primeira vez nesta página??</label><br>
        <input type="radio" name="primeiraVez" value="sim"> Sim
        <input type="radio" name="primeiraVez" value="nao"> Não
        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>

</body>

</html>
