<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 3 - Decrescente</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { color: #facc15; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #2a2a35; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .input-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; text-align: center; }
        button { background: #facc15; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #eab308; }
        #resultado { margin-top: 20px; font-size: 1.2rem; color: #facc15; text-align: center; }
    </style>
</head>
<body>
    <h1>Questão 3 - Ordem Decrescente</h1>
    <div class="card">
        <p>Digite 5 números:</p>
        <div class="input-grid">
            <input type="number" class="num-input">
            <input type="number" class="num-input">
            <input type="number" class="num-input">
            <input type="number" class="num-input">
            <input type="number" class="num-input">
        </div>
        <button id="btnOrdenar">Ordenar</button>
        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('btnOrdenar').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.num-input');
            const arr = Array.from(inputs).map(el => Number(el.value) || 0);
            
            arr.sort((x, y) => y - x);
            
            document.getElementById('resultado').innerHTML = `Resultado: <strong>${arr.join(' > ')}</strong>`;
        });
    </script>
</body>
</html>
