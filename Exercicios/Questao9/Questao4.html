<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 4 - Array Decrescente</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { color: #f87171; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #2a2a35; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }
        button { background: #f87171; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #ef4444; }
        #resultado { margin-top: 20px; font-size: 1.2rem; color: #f87171; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Questão 4 - Array em Ordem Decrescente</h1>
    <div class="card">
        <label>Digite números separados por vírgula:</label>
        <input type="text" id="arrayInput" placeholder="Ex: 10, 3, 50, 7">
        <button id="btnOrdenar">Processar Array</button>
        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('btnOrdenar').addEventListener('click', () => {
            const raw = document.getElementById('arrayInput').value;
            const processado = raw.split(',')
                                  .map(v => parseFloat(v.trim()))
                                  .filter(v => !isNaN(v))
                                  .sort((a, b) => b - a);
            
            document.getElementById('resultado').innerHTML = `Array Ordenado: <br><strong>[ ${processado.join(', ')} ]</strong>`;
        });
    </script>
</body>
</html>
