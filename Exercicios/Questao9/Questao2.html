<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 2 - Contar Letras A</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { color: #60a5fa; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #2a2a35; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; }
        button { background: #60a5fa; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #3b82f6; }
        #resultado { margin-top: 20px; font-size: 1.2rem; color: #60a5fa; }
    </style>
</head>
<body>
    <h1>Questão 2 - Contar Letras 'A'</h1>
    <div class="card">
        <label>Digite uma frase:</label>
        <input type="text" id="fraseInput" placeholder="Ex: Analise Avancada...">
        <button id="btnContar">Contar</button>
        <div id="resultado"></div>
    </div>

    <script>
        const contarAs = (texto) => {
            const matches = texto.match(/[aA]/g);
            return matches ? matches.length : 0;
        };

        document.getElementById('btnContar').addEventListener('click', () => {
            const texto = document.getElementById('fraseInput').value;
            const qtd = contarAs(texto);
            document.getElementById('resultado').innerHTML = `A frase possui <strong>${qtd}</strong> letra(s) 'A'.`;
        });
    </script>
</body>
</html>
