<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 1 - Soma de 2 Números</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 800px; margin: auto; }
        h1 { color: #4ade80; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .result { background: #2a2a35; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #4ade80; }
    </style>
</head>
<body>
    <h1>Questão 1 - Soma de 2 Números</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        const printResult = (title, text) => {
            output.innerHTML += `<div class="result"><strong>${title}:</strong> ${text}</div>`;
        };

        function soma1(a, b) {
            return a + b;
        }
        printResult('Tipo 1', `3 + 5 = ${soma1(3, 5)}`);

        const soma2 = function(a, b) {
            return a + b;
        };
        printResult('Tipo 2', `10 + 7 = ${soma2(10, 7)}`);

        const soma3 = (a, b) => a + b;
        printResult('Tipo 3', `4 + 6 = ${soma3(4, 6)}`);

        const resultado4 = ((a, b) => a + b)(8, 2);
        printResult('Tipo 4', `8 + 2 = ${resultado4}`);

        const obj = {
            soma(a, b) {
                return a + b;
            }
        };
        printResult('Tipo 5', `15 + 5 = ${obj.soma(15, 5)}`);

        const soma6 = (a = 0, b = 0) => a + b;
        printResult('Tipo 6', `Sem params: ${soma6()} | Com params (9,3): ${soma6(9, 3)}`);
    </script>
</body>
</html>
