<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 10 - Encapsulamento</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { color: #c084fc; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #2a2a35; padding: 20px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #c084fc; }
    </style>
</head>
<body>
    <h1>Questão 10 - Orientação a Objetos</h1>
    <div id="saida"></div>

    <script>
        const criarAluno = () => {
            let ra;
            let nome;
            
            return {
                setRa: (valor) => ra = valor,
                setNome: (valor) => nome = valor,
                getRa: () => ra,
                getNome: () => nome
            };
        };

        const aluno5 = criarAluno();
        aluno5.setRa('1234567890');
        aluno5.setNome('Pedro');

        const div = document.getElementById('saida');
        div.innerHTML = `<div class="card">
            <p><strong>Nome do Aluno:</strong> ${aluno5.getNome()}</p>
            <p><strong>Registro Acadêmico:</strong> ${aluno5.getRa()}</p>
        </div>`;
    </script>
</body>
</html>
