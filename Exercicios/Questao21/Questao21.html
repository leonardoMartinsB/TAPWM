<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 21 - Objetos Livros</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { color: #f472b6; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .livro-card { background: #2a2a35; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #f472b6; }
    </style>
</head>
<body>
    <h1>Questão 21 - Cadastro de Livros</h1>
    <div id="biblioteca"></div>

    <script>
        const criarLivro = (titulo, autor) => ({ titulo, autor });

        const livro1 = criarLivro("Crime e Castigo", "Fiódor Dostoiévski");
        const livro2 = criarLivro("O Senhor dos Anéis", "J. R. R. Tolkien");

        const renderizarLivro = (livro) => {
            return `<div class="livro-card">
                <h3>📖 ${livro.titulo}</h3>
                <p><strong>Autor:</strong> ${livro.autor}</p>
            </div>`;
        };

        const biblioteca = document.getElementById('biblioteca');
        biblioteca.innerHTML = renderizarLivro(livro1) + renderizarLivro(livro2);
    </script>
</body>
</html>
