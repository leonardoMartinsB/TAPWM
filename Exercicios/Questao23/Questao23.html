<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 23 - Herança</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 2rem; max-width: 600px; margin: auto; }
        h1 { color: #2dd4bf; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .medico-card { background: #2a2a35; padding: 20px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #2dd4bf; }
        .badge { background: #111; padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; color: #2dd4bf; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Questão 23 - Corpo Clínico</h1>
    <div id="corpo-clinico"></div>

    <script>
        class Medico {
            constructor(nome, crm) {
                this.nome = nome;
                this.crm = crm;
            }
        }

        class Pediatra extends Medico {
            constructor(nome, crm, idadeMaxPaciente) {
                super(nome, crm);
                this.idadeMaxPaciente = idadeMaxPaciente;
            }
        }

        class Geriatra extends Medico {
            constructor(nome, crm, idadeMinimaPaciente) {
                super(nome, crm);
                this.idadeMinimaPaciente = idadeMinimaPaciente;
            } 
        }

        const medicos = [
            new Pediatra('Camila', '1234567890', 13),
            new Geriatra('Enzo', '1234567890', 70)
        ];

        const container = document.getElementById('corpo-clinico');
        
        medicos.forEach(med => {
            const isPediatra = med instanceof Pediatra;
            const especialidade = isPediatra ? 'Pediatra' : 'Geriatra';
            const extraInfo = isPediatra 
                ? `Atende até: ${med.idadeMaxPaciente} anos` 
                : `Atende a partir de: ${med.idadeMinimaPaciente} anos`;

            container.innerHTML += `
                <div class="medico-card">
                    <h2>🩺 Dr(a). ${med.nome} <span class="badge">${especialidade}</span></h2>
                    <p><strong>CRM:</strong> ${med.crm}</p>
                    <p><strong>Especialização:</strong> ${extraInfo}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
