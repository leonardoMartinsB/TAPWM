<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade 12 – Eventos</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0e1117;
            --surface: #161b27;
            --border: #2a3144;
            --accent: #e8c97a;
            --danger: #e05a5a;
            --open: #5abf8e;
            --closed: #7a9cc4;
            --text: #d4dbe8;
            --muted: #556070;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            color: var(--text);
            overflow: hidden;
        }

        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.4rem;
        }

        
        #titulo-principal {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--accent);
            text-shadow: 0 0 40px rgba(232, 201, 122, .25);
            transition: all .4s ease;
        }

        
        #status {
            font-family: 'DM Mono', monospace;
            font-size: .85rem;
            font-weight: 400;
            letter-spacing: .18em;
            text-transform: uppercase;
            padding: .45rem 1.4rem;
            border-radius: 2px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            transition: all .35s ease;
        }

        #status.aberta {
            color: var(--open);
            border-color: var(--open);
            box-shadow: 0 0 18px rgba(90, 191, 142, .2);
        }

        #status.fechada {
            color: var(--closed);
            border-color: var(--closed);
            box-shadow: 0 0 18px rgba(122, 156, 196, .2);
        }

        #status.quebrada {
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 0 18px rgba(224, 90, 90, .25);
        }

        
        #card {
            position: relative;
            width: 300px;
            height: 300px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            box-shadow: 0 8px 48px rgba(0, 0, 0, .5);
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow .35s ease, border-color .35s ease;
        }

        #card:hover {
            border-color: var(--accent);
            box-shadow: 0 12px 60px rgba(232, 201, 122, .12);
        }

        
        .win-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-svg.visible {
            opacity: 1;
        }

        
        #corner-hint {
            position: absolute;
            bottom: 10px;
            right: 12px;
            font-size: .65rem;
            letter-spacing: .1em;
            color: var(--muted);
            opacity: .6;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="wrapper">

        
        <h2 id="titulo-principal">Abra a Janela</h2>

        
        <div id="card" onmouseover="abrirJanela()" onmouseout="fecharJanela()" onclick="quebrarJanela()">

            
            <div class="win-svg visible" id="img-fechada">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="220">
                    
                    <rect x="20" y="20" width="160" height="160" rx="4" fill="#1e2a3a" stroke="#4a6080"
                        stroke-width="3" />
                    
                    <line x1="100" y1="20" x2="100" y2="180" stroke="#4a6080" stroke-width="3" />
                    <line x1="20" y1="100" x2="180" y2="100" stroke="#4a6080" stroke-width="3" />
                    
                    <rect x="24" y="24" width="72" height="72" rx="2" fill="#2b3f55" opacity=".8" />
                    <rect x="104" y="24" width="72" height="72" rx="2" fill="#2b3f55" opacity=".8" />
                    <rect x="24" y="104" width="72" height="72" rx="2" fill="#2b3f55" opacity=".8" />
                    <rect x="104" y="104" width="72" height="72" rx="2" fill="#2b3f55" opacity=".8" />
                    
                    <line x1="30" y1="30" x2="50" y2="30" stroke="white" stroke-width="1.5" opacity=".18" />
                    <line x1="30" y1="30" x2="30" y2="50" stroke="white" stroke-width="1.5" opacity=".18" />
                    
                    <rect x="94" y="94" width="12" height="12" rx="2" fill="#e8c97a" />
                </svg>
            </div>

            
            <div class="win-svg" id="img-aberta">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="220">
                    
                    <rect x="20" y="20" width="160" height="160" rx="4" fill="#0f2233" stroke="#5abf8e"
                        stroke-width="3" />
                    
                    <circle cx="50" cy="55" r="1.5" fill="white" opacity=".7" />
                    <circle cx="140" cy="40" r="1" fill="white" opacity=".5" />
                    <circle cx="80" cy="35" r="1" fill="white" opacity=".6" />
                    <circle cx="160" cy="70" r="1.5" fill="white" opacity=".6" />
                    <circle cx="35" cy="80" r="1" fill="white" opacity=".4" />
                    
                    <circle cx="148" cy="52" r="12" fill="#d4e8ff" opacity=".85" />
                    <circle cx="155" cy="48" r="9" fill="#0f2233" />
                    
                    <rect x="20" y="148" width="160" height="32" fill="#0a3d1a" opacity=".9" />
                    
                    <rect x="20" y="20" width="30" height="160" rx="2" fill="#1e2a3a" stroke="#5abf8e" stroke-width="2"
                        opacity=".9" />
                    
                    <rect x="150" y="20" width="30" height="160" rx="2" fill="#1e2a3a" stroke="#5abf8e" stroke-width="2"
                        opacity=".9" />
                    
                    <rect x="20" y="20" width="160" height="18" rx="2" fill="#1e2a3a" stroke="#5abf8e"
                        stroke-width="2" />
                    
                    <path d="M75 100 Q95 90 115 100" stroke="#5abf8e" stroke-width="1.5" fill="none" opacity=".5" />
                    <path d="M75 112 Q95 102 115 112" stroke="#5abf8e" stroke-width="1.5" fill="none" opacity=".35" />
                </svg>
            </div>

            
            <div class="win-svg" id="img-quebrada">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="220">
                    
                    <rect x="20" y="20" width="160" height="160" rx="4" fill="#2a1515" stroke="#e05a5a"
                        stroke-width="3" />
                    
                    <rect x="24" y="24" width="152" height="152" rx="2" fill="#1a0f0f" opacity=".9" />
                    
                    <g stroke="#e05a5a" stroke-width="1.5" fill="none" opacity=".85">
                        <line x1="100" y1="100" x2="60" y2="30" />
                        <line x1="100" y1="100" x2="140" y2="25" />
                        <line x1="100" y1="100" x2="178" y2="65" />
                        <line x1="100" y1="100" x2="180" y2="115" />
                        <line x1="100" y1="100" x2="145" y2="178" />
                        <line x1="100" y1="100" x2="80" y2="180" />
                        <line x1="100" y1="100" x2="22" y2="160" />
                        <line x1="100" y1="100" x2="20" y2="80" />
                        <line x1="100" y1="100" x2="25" y2="40" />
                        
                        <line x1="60" y1="30" x2="140" y2="25" />
                        <line x1="140" y1="25" x2="178" y2="65" />
                        <line x1="60" y1="30" x2="22" y2="80" />
                        <line x1="178" y1="65" x2="180" y2="115" />
                        <line x1="180" y1="115" x2="145" y2="178" />
                        <line x1="80" y1="180" x2="22" y2="160" />
                        <line x1="22" y1="160" x2="20" y2="80" />
                    </g>
                    
                    <circle cx="100" cy="100" r="6" fill="#e05a5a" opacity=".9" />
                    <circle cx="100" cy="100" r="3" fill="#fff" opacity=".8" />
                    
                    <polygon points="55,42 70,60 45,65" fill="#e05a5a" opacity=".15" />
                    <polygon points="150,35 160,55 140,58" fill="#e05a5a" opacity=".15" />
                    <polygon points="155,140 170,158 145,165" fill="#e05a5a" opacity=".12" />
                    
                    <text x="100" y="168" text-anchor="middle" font-size="18" fill="#e05a5a" font-family="monospace"
                        opacity=".7">⚠</text>
                </svg>
            </div>

            <span id="corner-hint">hover / click</span>
        </div>

        
        <h1 id="status" class="fechada">Janela Fechada</h1>

    </div>

    <script>
        const imgs = {
            fechada: document.getElementById('img-fechada'),
            aberta: document.getElementById('img-aberta'),
            quebrada: document.getElementById('img-quebrada')
        };
        const status = document.getElementById('status');
        const titulo = document.getElementById('titulo-principal');
        const hint = document.getElementById('corner-hint');

        let quebrada = false;

        function mostrar(estado) {
            Object.values(imgs).forEach(el => el.classList.remove('visible'));
            imgs[estado].classList.add('visible');
        }

        function abrirJanela() {
            if (quebrada) return;
            mostrar('aberta');
            status.textContent = 'Janela Aberta';
            status.className = 'aberta';
            titulo.textContent = 'A Janela Está Aberta';
            hint.style.opacity = '0';
        }

        function fecharJanela() {
            if (quebrada) return;
            mostrar('fechada');
            status.textContent = 'Janela Fechada';
            status.className = 'fechada';
            titulo.textContent = 'Abra a Janela';
            hint.style.opacity = '.6';
        }

        function quebrarJanela() {
            quebrada = true;
            mostrar('quebrada');
            status.textContent = 'Janela Quebrada';
            status.className = 'quebrada';
            titulo.textContent = 'Você Quebrou a Janela!';
            hint.textContent = 'F5 para reiniciar';
            hint.style.opacity = '.7';
        }
    </script>

</body>

</html>
